[project]
name = "pageclock"
version = "0.1.0"
description = "Clock-sweep buffer pool. Same pin, dirty, and second-chance rules as the Rust crate. Zero dependencies."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
keywords = ["buffer-pool", "clock", "database", "pages"]
dependencies = []

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["pageclock*"]
